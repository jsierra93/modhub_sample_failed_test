[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modhub-sample-failed-test"
version = "0.1.0"
description = "Small profile directory library, still on Pydantic v1."
requires-python = ">=3.10"
dependencies = ["pydantic>=1.10,<2"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
